onboarding = false
# herdr configuration
# Validate: herdr config check    Apply: herdr server reload-config (or prefix+shift+r)
# Docs:     https://herdr.dev/docs/configuration/

[keys]
# Years of tmux/screen muscle memory. Pass-through is covered: `a` after the
# prefix sends a literal ctrl+a to the pane (readline beginning-of-line), and
# ctrl+e (end-of-line) is unclaimed — so shell line editing survives the remap.
# Nested herdr (ssh -> herdr on a remote): ctrl+a ctrl+a q detaches the INNER
# session (the second prefix passes through to the pane's herdr).
prefix = "ctrl+a"

# Mental model carried over from tmux: one repo = one workspace (what tmux
# called a "window"). So `n` — the old new-window habit — creates workspaces.
new_workspace = ["prefix+n", "prefix+shift+n"]
new_tab = "prefix+c"  # tabs are occasional per-repo views (e.g. a PR-review layout)
next_tab = ""         # unbound: n was herdr's next-tab; use prefix+1..9 / prefix+g

# Terminals deliver shift+punctuation inconsistently (the shifted symbol vs
# shift+key), so every variant is bound — whichever Ghostty sends, one matches.
split_vertical = ["prefix+v", "prefix+shift+backslash", "prefix+|"]
split_horizontal = ["prefix+minus", "prefix+shift+minus", "prefix+_"]

# Navigate mode (prefix+w) defaults to arrows; j/k walk the workspace list
# instead. Pane focus keeps h/l; vertical pane focus moves to shift+j/shift+k
# (plain arrows always work for panes regardless).
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "shift+k"
navigate_pane_down = "shift+j"

# Git tools own the g family: prefix+g lazygit, prefix+shift+g serie graph.
# goto (fuzzy picker) moves to prefix+f; new_worktree (unused) gives up its key.
goto = "prefix+f"
new_worktree = ""

# Stock herdr, relied on daily but not configured here: prefix+h/j/k/l focus
# panes, prefix+shift+h/j/k/l swap directionally, prefix+[ vi copy mode,
# prefix+shift+r reload, prefix+? live keymap.

# zsh -lc on both: the server starts from launchd, whose PATH has no brew
# or ~/.local/bin, so a bare command name exits 127 before the popup draws.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "zsh -lc lazygit"
width = "95%"
height = "95%"

# Quick glance; the full flow is `gg` (git-graph). -p kitty: serie's
# detection doesn't recognize herdr; popup graphics placement needs the
# lelopez-io/herdr popup-kitty-graphics fork.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "zsh -lc 'serie -p kitty'"
width = "80%"
height = "85%"

# o family, like g: plain = this repo, shift = the obsidian vault.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "zsh -lc 'nvim .'"
width = "95%"
height = "95%"

# -i: only interactive shells source ~/.zshrc.local, home of OBSIDIAN_VAULT.
# 130 cols: ~120ch prose + nvim gutters + popup border; percent width would
# drift with the display.
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "zsh -ilc 'cd \"${OBSIDIAN_VAULT:?set in ~/.zshrc.local}\" && nvim .'"
width = 130
height = "95%"

[terminal]
# Default, stated explicitly because tmux splits relied on -c pane_current_path:
# new panes/tabs/workspaces inherit the focused pane's directory.
new_cwd = "follow"

[ui]
# Drag-select copies immediately (tmux needed a MouseDragEnd1Pane binding for
# this; herdr is mouse-native).
copy_on_select = true

# Tab bar only appears once a space grows a second tab (e.g. a review tab);
# single-tab spaces — the common case — stay clean.
hide_tab_bar_when_single_tab = true

# Don't block tab creation on a name prompt; tabs get generated names and
# can be renamed later with prefix+shift+t.
prompt_new_tab_name = false

# Screen-sharing hygiene: sidebar hidden at launch, and collapsing hides it
# entirely (zero width, no status rail). Toggle with prefix+b.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

# Show the detected agent (pi, claude) on pane borders when no manual pane
# name is set.
show_agent_labels_on_pane_borders = true

[session]
# Reboot persistence for agents: after a server restart, pi/claude panes
# resume their native conversation sessions. Works because both integrations
# are installed (herdr integration status). Default true; stated because this
# replaces tmux resurrect/continuum.
resume_agents_on_restore = true

[experimental]
# Kitty graphics for image.nvim/mermaid inside panes (tmux needed
# allow-passthrough for this). Outer terminal is Ghostty, which supports it.
kitty_graphics = true

# Restore pane scrollback across full server restarts. With the LaunchAgent
# (brew services start herdr) starting the server at login, this is the
# resurrect/continuum replacement for reboots. Shells respawn fresh in their
# cwd — same limit resurrect always had.
pane_history = true

[ui.toast]
delivery = "herdr"

[theme]
name = "one-dark"
auto_switch = false
