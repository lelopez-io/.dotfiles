# serie — https://lusingander.github.io/serie/
#   user commands https://lusingander.github.io/serie/features/user-command.html
#
# Stock serie stops at a commit's file list; these commands add diffs.

[keybind]
# q backs out one level: closes an open view, quits from the list (the
# fork maps Close to Quit on the root view). esc still closes views.
close = ["q"]
user_command_1 = ["|"]
user_command_2 = ["\\"]
user_command_3 = ["v"]
user_command_4 = ["shift-p"]
user_command_5 = ["shift-f"]

[core.user_command]
# | and \ mirror lazygit's renderer-cycle keys. Captured stdout is not a
# tty: git/delta need --color=always and explicit --width. zsh -lc:
# popups inherit the launchd PATH (see herdr config).
commands_1 = { name = "split diff", commands = ["zsh", "-lc", "case {{target_hash}} in 0000000*) git diff --color=always ;; *) git show --color=always {{target_hash}} ;; esac | delta --paging=never --side-by-side --width={{area_width}}"] }
commands_2 = { name = "unified diff", commands = ["zsh", "-lc", "case {{target_hash}} in 0000000*) git diff --color=always ;; *) git show --color=always {{target_hash}} ;; esac | delta --paging=never --width={{area_width}}"] }

# trigger = "select": fires (debounced) as the cursor settles on a row,
# and v runs it immediately. Failures land in serie's status line.
commands_3 = { name = "review commit", type = "silent", trigger = "select", commands = ["zsh", "-lc", "git-graph --send {{target_hash}}"] }

# silent + refresh: a good push moves the origin markers in place; a
# rejected one lands its stderr in the status line.
commands_4 = { name = "push", type = "silent", refresh = true, commands = ["git", "push"] }

# fetch is invisible to the status-watcher auto-refresh; pair it with one.
commands_5 = { name = "fetch", type = "silent", refresh = true, commands = ["git", "fetch", "--prune"] }

# Rows, not a share. 45 of the ~65-row popup makes | and \ diff-heavy
# like the gg layout; small terminals clamp safely.
[ui.user_command]
height = 45

# hash + subject rows mirror the pr-respond reply format, so a reply's
# hash finds its row at a glance; / search matches hashes regardless.
# name/date stay on the selected-commit footer line.
[ui.list]
columns = ["graph", "marker", "hash", "subject"]
